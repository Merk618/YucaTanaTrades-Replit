openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: YucaTanaTrades API
servers:
  - url: /api
    description: Base API path
security:
  - cookieAuth: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Opaque cookie-session authentication and account recovery. Every response uses Cache-Control `no-store, private`, Pragma `no-cache`, Expires `0`, and Vary `Cookie`; the application does not emit ETags.
  - name: journal
    description: Trade journal entries
  - name: watchlist
    description: Watchlist management
  - name: bots
    description: Bot status and logs
  - name: portfolio
    description: Portfolio data
  - name: market
    description: Market quotes, source health, and session status
  - name: settings
    description: App settings and user preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Get authentication service availability and feature flags
      security: []
      responses:
        "200":
          description: Authentication service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "503":
          description: Authentication service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Get the current guest or authenticated server-side session
      description: Returns a valid current session without charging the guest-issuance limit. A missing, invalid, expired, or revoked cookie triggers replacement guest issuance, limited by an HMAC client-network key to 30 attempts per 15 minutes.
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: Current session state and synchronizer CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "429":
          description: Guest-session issuance rate limit exceeded; no replacement session is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: Authentication service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in and rotate the current guest session
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Authenticated session created and rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Generic credential failure or missing/expired guest session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Invalid synchronizer CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register an account and rotate into an authenticated session
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account and authenticated session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          description: Generic registration failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Registration disabled or synchronizer CSRF token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Revoke the current session and rotate to a guest session
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Current session revoked and guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Invalid synchronizer CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/sign-out-all:
    post:
      operationId: signOutAllDevices
      tags: [auth]
      summary: Revoke every active session for the current user
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: All user sessions revoked and a guest session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Invalid synchronizer CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password-reset message
      description: Always returns a generic accepted response regardless of whether the normalized email belongs to an account or its issuance limit is exceeded. Limited requests record a blocked audit outcome and do not persist a reset token.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: Request accepted without disclosing account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentTokenActionResponse"
        "400":
          $ref: "#/components/responses/InvalidAuthRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Feature disabled or synchronizer CSRF token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/password/reset:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Complete a password reset with a single-use token
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset completed and prior sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericActionResponse"
        "400":
          description: Invalid, expired, or consumed reset request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Feature disabled or synchronizer CSRF token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: Request a new email-verification message
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Verification request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentTokenActionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Feature disabled or synchronizer CSRF token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /auth/email-verification/complete:
    post:
      operationId: completeEmailVerification
      tags: [auth]
      summary: Complete email verification with a single-use token
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteEmailVerificationInput"
      responses:
        "200":
          description: Email verification completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericActionResponse"
        "400":
          description: Invalid, expired, or consumed verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Feature disabled or synchronizer CSRF token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List all trade journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a new journal entry
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /journal/{id}:
    get:
      operationId: getJournalEntry
      tags: [journal]
      summary: Get a journal entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    patch:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update a journal entry
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a journal entry
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /journal/summary:
    get:
      operationId: getJournalSummary
      tags: [journal]
      summary: Get win/loss summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /watchlist:
    get:
      operationId: listWatchlistItems
      tags: [watchlist]
      summary: Get all watchlist items
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    post:
      operationId: addWatchlistItem
      tags: [watchlist]
      summary: Add ticker to watchlist
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /watchlist/{id}:
    delete:
      operationId: removeWatchlistItem
      tags: [watchlist]
      summary: Remove item from watchlist
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /bots/status:
    get:
      operationId: getBotsStatus
      tags: [bots]
      summary: Get status of all bots
      responses:
        "200":
          description: Bot statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotsStatus"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio overview summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /positions/bulk:
    post:
      operationId: bulkCreatePositions
      tags: [portfolio]
      summary: Bulk-create portfolio positions (CSV import)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreatePositionsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreatePositionsResult"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /positions:
    get:
      operationId: listPositions
      tags: [portfolio]
      summary: List all portfolio positions
      responses:
        "200":
          description: List of positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioPosition"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    post:
      operationId: createPosition
      tags: [portfolio]
      summary: Create a new portfolio position
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioPositionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPosition"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /positions/{id}:
    get:
      operationId: getPosition
      tags: [portfolio]
      summary: Get a position by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPosition"
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    patch:
      operationId: updatePosition
      tags: [portfolio]
      summary: Update a portfolio position
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioPositionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPosition"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    delete:
      operationId: deletePosition
      tags: [portfolio]
      summary: Delete a portfolio position
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /settings/risk:
    get:
      operationId: getRiskConfig
      tags: [settings]
      summary: Get the active risk threshold configuration
      responses:
        "200":
          description: Active risk config (DB row or hardcoded defaults)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskConfig"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"
    put:
      operationId: updateRiskConfig
      tags: [settings]
      summary: Update risk threshold configuration
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskConfigInput"
      responses:
        "200":
          description: Updated risk config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskConfig"
        "400":
          description: Validation error
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/RequestOriginRejected"
        "503":
          $ref: "#/components/responses/OwnershipOrAuthUnavailable"

  /market/quotes:
    get:
      operationId: getMarketQuotes
      tags: [market]
      summary: Batch quotes with source + freshness metadata
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated ticker symbols (e.g. SPY,BTC,NVDA)
          schema:
            type: string
      responses:
        "200":
          description: Quotes with trust metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteList"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /market/health:
    get:
      operationId: getSourceHealth
      tags: [market]
      summary: Real provider/source health status
      parameters:
        - name: refresh
          in: query
          required: false
          description: Force a fresh probe of every provider, bypassing cache
          schema:
            type: boolean
      responses:
        "200":
          description: Source health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceHealth"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /market/session:
    get:
      operationId: getMarketSession
      tags: [market]
      summary: Real US equity market session + crypto status
      responses:
        "200":
          description: Market session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSession"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /market/test:
    get:
      operationId: testQuoteFetch
      tags: [market]
      summary: Test-fetch reference quotes (SPY / BTC) to verify live sources
      responses:
        "200":
          description: Test quote result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteList"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ytt_session
      description: Opaque Secure session cookie used for HTTPS production and preview environments. Local loopback HTTP development uses the non-Secure ytt_session name while preserving HttpOnly, SameSite, Path, and server-side session semantics.
  responses:
    InvalidAuthRequest:
      description: Invalid authentication request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthRequired:
      description: Missing, expired, or revoked authenticated/session context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    RequestOriginRejected:
      description: Request origin or synchronizer CSRF verification failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthUnavailable:
      description: Authentication service or storage unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    OwnershipOrAuthUnavailable:
      description: Authentication service unavailable or user-data ownership migration required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Synchronizer token returned in SessionEnvelope for the current server-side session.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthStatus:
      type: object
      required: [available, features, message]
      properties:
        available:
          type: boolean
        features:
          $ref: "#/components/schemas/AuthFeatures"
        message:
          type: ["string", "null"]

    AuthFeatures:
      type: object
      required: [registrationEnabled, passwordResetEnabled, emailVerificationEnabled]
      properties:
        registrationEnabled:
          type: boolean
        passwordResetEnabled:
          type: boolean
        emailVerificationEnabled:
          type: boolean

    SessionState:
      type: string
      enum: [guest, authenticated, expired]

    SessionUser:
      type: object
      required: [id, email, displayName, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: ["string", "null"]
        emailVerified:
          type: boolean

    SessionEnvelope:
      type: object
      required: [state, user, expiresAt, csrfToken]
      properties:
        state:
          $ref: "#/components/schemas/SessionState"
        user:
          oneOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: "null"
        expiresAt:
          type: ["string", "null"]
          format: date-time
        csrfToken:
          type: string
          minLength: 32
          description: Synchronizer token for unsafe requests in this session; never a session credential.

    SignInInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 256
        displayName:
          type: ["string", "null"]
          maxLength: 100
          description: Optional presentation name. Null, omission, or an empty/whitespace-only value is stored as no display name.

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 2048
        password:
          type: string
          minLength: 12
          maxLength: 256

    CompleteEmailVerificationInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 2048

    GenericActionResponse:
      type: object
      required: [accepted, message]
      properties:
        accepted:
          type: boolean
        message:
          type: string

    DevelopmentTokenActionResponse:
      type: object
      required: [accepted, message]
      properties:
        accepted:
          type: boolean
        message:
          type: string
        developmentToken:
          type: string
          description: Explicitly gated nonproduction-only token channel enabled by AUTH_EXPOSE_DEV_TOKENS; never present in production. A forgot-password value may be a nonpersisted decoy for an unknown or limited request.

    AuthError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_credentials, unauthorized, csrf_invalid, session_expired, rate_limited, unavailable, ownership_migration_required]
        message:
          type: string

    JournalEntry:
      type: object
      required: [id, ticker, setupType, side, entryPrice, exitPrice, pnl, pnlPercent, thesis, outcome, tradeDate, createdAt]
      properties:
        id:
          type: integer
        ticker:
          type: string
        setupType:
          type: string
        side:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        exitPrice:
          type: ["number", "null"]
        pnl:
          type: ["number", "null"]
        pnlPercent:
          type: ["number", "null"]
        thesis:
          type: string
        mistakes:
          type: ["string", "null"]
        lessons:
          type: ["string", "null"]
        outcome:
          type: string
          enum: [win, loss, breakeven, open]
        sector:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        tradeDate:
          type: string
        createdAt:
          type: string

    JournalEntryInput:
      type: object
      required: [ticker, setupType, side, entryPrice, thesis, outcome, tradeDate]
      properties:
        ticker:
          type: string
        setupType:
          type: string
        side:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        exitPrice:
          type: ["number", "null"]
        pnl:
          type: ["number", "null"]
        pnlPercent:
          type: ["number", "null"]
        thesis:
          type: string
        mistakes:
          type: ["string", "null"]
        lessons:
          type: ["string", "null"]
        outcome:
          type: string
          enum: [win, loss, breakeven, open]
        sector:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        tradeDate:
          type: string

    JournalEntryUpdate:
      type: object
      properties:
        ticker:
          type: string
        setupType:
          type: string
        side:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        exitPrice:
          type: ["number", "null"]
        pnl:
          type: ["number", "null"]
        pnlPercent:
          type: ["number", "null"]
        thesis:
          type: string
        mistakes:
          type: ["string", "null"]
        lessons:
          type: ["string", "null"]
        outcome:
          type: string
          enum: [win, loss, breakeven, open]
        sector:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        tradeDate:
          type: string

    JournalSummary:
      type: object
      required: [totalTrades, wins, losses, breakevens, openTrades, winRate, totalPnl, avgWin, avgLoss]
      properties:
        totalTrades:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        breakevens:
          type: integer
        openTrades:
          type: integer
        winRate:
          type: number
        totalPnl:
          type: number
        avgWin:
          type: number
        avgLoss:
          type: number

    WatchlistItem:
      type: object
      required: [id, ticker, sector, notes, addedAt]
      properties:
        id:
          type: integer
        ticker:
          type: string
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priority:
          type: string
          enum: [high, medium, low]
        addedAt:
          type: string

    WatchlistItemInput:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
        sector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        priority:
          type: string
          enum: [high, medium, low]

    BotsStatus:
      type: object
      required: [moomoo, cryptoHunter]
      properties:
        moomoo:
          $ref: "#/components/schemas/BotStatus"
        cryptoHunter:
          $ref: "#/components/schemas/BotStatus"

    BotStatus:
      type: object
      required: [name, status, lastScan, scansToday, isReadOnly]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [online, offline, scanning, idle, error]
        lastScan:
          type: ["string", "null"]
        scansToday:
          type: integer
        isReadOnly:
          type: boolean
        lastResult:
          type: ["string", "null"]
        health:
          type: string
          enum: [good, warning, critical]

    PortfolioSummary:
      type: object
      required: [totalValue, dayChange, dayChangePct, totalGain, totalGainPct, rothIra, individual, crypto]
      properties:
        totalValue:
          type: number
        dayChange:
