    BulkCreatePositionsInput:
      type: object
      required: [positions]
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPositionInput"
          minItems: 1

    BulkCreatePositionsResult:
      type: object
      required: [created, positions]
      properties:
        created:
          type: integer
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPosition"

    Quote:
      type: object
      required:
        [symbol, assetClass, price, change, changePercent, provider, sourceLabel, timestamp, isLive, isDelayed, isStale, isFallback, isDemo, marketSession, confidence, error]
      properties:
        symbol:
          type: string
        assetClass:
          type: string
          enum: [equity, etf, crypto, fundamentals, ai]
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        provider:
          type: string
        sourceLabel:
          type: string
        timestamp:
          type: string
        isLive:
          type: boolean
        isDelayed:
          type: boolean
        isStale:
          type: boolean
        isFallback:
          type: boolean
        isDemo:
          type: boolean
        marketSession:
          type: string
          enum: [open, pre, post, closed, holiday, "24h"]
        confidence:
          type: number
        error:
          type: ["string", "null"]
        open:
          type: ["number", "null"]
          description: Day open price; null when provider does not supply OHLC.
        high:
          type: ["number", "null"]
          description: Day high price; null when provider does not supply OHLC.
        low:
          type: ["number", "null"]
          description: Day low price; null when provider does not supply OHLC.
        volume:
          type: ["number", "null"]
          description: Day/24h volume; null when provider does not supply it.

    QuoteList:
      type: object
      required: [asOf, quotes]
      properties:
        asOf:
          type: string
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/Quote"

    ProviderStatus:
      type: object
      required:
        [id, name, status, assetClasses, capabilities, configured, readOnly, isTradingCapable, liveCapable, envVars, sourceLabel, message, lastCheckedAt, lastSuccessAt, latencyMs, detail]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            [connected, delayed, read_only, missing_api_key, auth_failed, health_check_failed, rate_limited, stale, not_connected, disabled, future_ready]
        assetClasses:
          type: array
          items:
            type: string
            enum: [equity, etf, crypto, fundamentals, ai]
        capabilities:
          type: array
          items:
            type: string
            enum: [quotes, fundamentals, news, filings, analysis, trading]
        configured:
          type: boolean
        readOnly:
          type: boolean
        isTradingCapable:
          type: boolean
        liveCapable:
          type: boolean
        envVars:
          type: array
          items:
            type: string
        sourceLabel:
          type: string
        message:
          type: string
        lastCheckedAt:
          type: string
        lastSuccessAt:
          type: ["string", "null"]
        latencyMs:
          type: ["number", "null"]
        detail:
          type: ["string", "null"]

    SourceHealthSummary:
      type: object
      required: [assetClass, label, activeProvider, activeProviderLabel, status, fallbackInUse, sourceLabel]
      properties:
        assetClass:
          type: string
          enum: [equity, etf, crypto, fundamentals, ai]
        label:
          type: string
        activeProvider:
          type: ["string", "null"]
        activeProviderLabel:
          type: ["string", "null"]
        status:
          type: string
        fallbackInUse:
          type: boolean
        sourceLabel:
          type: ["string", "null"]

    SourceHealth:
      type: object
      required: [asOf, providers, summary]
      properties:
        asOf:
          type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
        summary:
          type: array
          items:
            $ref: "#/components/schemas/SourceHealthSummary"

    MarketSessionSegment:
      type: object
      required: [state, isOpen, label]
      properties:
        state:
          type: string
          enum: [open, pre, post, closed, holiday, "24h"]
        isOpen:
          type: boolean
        label:
          type: string
        timezone:
          type: string
        nextChange:
          type: ["string", "null"]

    MarketSession:
      type: object
      required: [asOf, equities, crypto]
      properties:
        asOf:
          type: string
        equities:
          $ref: "#/components/schemas/MarketSessionSegment"
        crypto:
          $ref: "#/components/schemas/MarketSessionSegment"

    RiskConfig:
      type: object
      required: [singlePositionLimit, cryptoPositionLimit, cryptoAllocationLimit, sectorConcentrationLimit, maxDrawdownAlert, isDefault, updatedAt]
      properties:
        singlePositionLimit:
          type: integer
          description: Max % of total portfolio in any single non-crypto holding
        cryptoPositionLimit:
          type: integer
          description: Max % of total portfolio in any single crypto holding
        cryptoAllocationLimit:
          type: integer
          description: Max % of total portfolio in the crypto sleeve
        sectorConcentrationLimit:
          type: integer
          description: Max % of total portfolio in any one sector
        maxDrawdownAlert:
          type: integer
          description: Max drawdown % before alert fires
        isDefault:
          type: boolean
          description: True when no user row exists and defaults are returned
        updatedAt:
          type: ["string", "null"]
          description: ISO timestamp of last user update, null when using defaults

    RiskConfigInput:
      type: object
      required: [singlePositionLimit, cryptoPositionLimit, cryptoAllocationLimit, sectorConcentrationLimit, maxDrawdownAlert]
      properties:
        singlePositionLimit:
          type: integer
          minimum: 1
          maximum: 100
        cryptoPositionLimit:
          type: integer
          minimum: 1
          maximum: 100
        cryptoAllocationLimit:
          type: integer
          minimum: 1
          maximum: 100
        sectorConcentrationLimit:
          type: integer
          minimum: 1
          maximum: 100
        maxDrawdownAlert:
          type: integer
          minimum: 1
          maximum: 100
