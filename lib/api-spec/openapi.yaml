        ticker:
          type: string
        name:
          type: string
        shares:
          type: number
        avgCost:
          type: number
        sleeve:
          $ref: "#/components/schemas/PortfolioPositionSleeve"
        sector:
          type: string
        createdAt:
          type: string

    PortfolioPositionInput:
      type: object
      required: [ticker, name, shares, avgCost, sleeve, sector]
      properties:
        ticker:
          type: string
        name:
